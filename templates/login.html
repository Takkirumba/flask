<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Login - Premium Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111827; color: white; font-family: 'Prompt', sans-serif; }
        .card-login { background: rgba(31, 41, 55, 0.8); border: 1px solid #fbbf24; border-radius: 20px; padding: 40px; width: 400px; }
        .form-control { background: #374151; border: 1px solid #4b5563; color: white; }
        .form-control:focus { background: #4b5563; color: white; border-color: #fbbf24; box-shadow: none; }
        label { color: #fbbf24; margin-bottom: 5px; font-weight: 500; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card-login shadow-lg">
        <h3 class="text-center mb-4">เข้าสู่ระบบ</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for c, m in messages %}<div class="alert alert-{{c}} small">{{m}}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <div class="mb-3">
                <label>เลขบัญชี</label>
                <input type="text" name="account_number" class="form-control" placeholder="ระบุเลขบัญชี" required>
            </div>
            <div class="mb-4">
                <label>รหัสผ่าน</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mb-3" style="background: #fbbf24;">Login</button>
            <div class="text-center small"><a href="/signup" class="text-white">ยังไม่มีบัญชี? สมัครที่นี่</a></div>
        </form>
    </div>
</body>
</html>
