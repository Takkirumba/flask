<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Premium Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111827; color: white; font-family: 'Prompt', sans-serif; }
        .card-signup { background: rgba(31, 41, 55, 0.8); border: 1px solid #10b981; border-radius: 20px; padding: 40px; width: 450px; }
        .form-control { background: #374151; border: 1px solid #4b5563; color: white; }
        label { color: #10b981; font-weight: 500; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card-signup shadow-lg">
        <h3 class="text-center mb-4 text-success">สมัครบัญชีใหม่</h3>
        <form action="/signup" method="POST">
            <div class="mb-3"><label>เลขบัญชี</label><input type="text" name="account_number" class="form-control" required></div>
            <div class="mb-3"><label>ชื่อผู้ใช้งาน</label><input type="text" name="username" class="form-control" required></div>
            <div class="mb-4"><label>กำหนดรหัสผ่าน</label><input type="password" name="password" class="form-control" required></div>
            <button type="submit" class="btn btn-success w-100 fw-bold mb-3">ยืนยันการสมัคร</button>
            <div class="text-center small"><a href="/login" class="text-white">มีบัญชีแล้ว? เข้าสู่ระบบ</a></div>
        </form>
    </div>
</body>
</html>
